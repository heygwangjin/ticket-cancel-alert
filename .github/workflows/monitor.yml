name: 취소표 감시

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub 사정으로 실제로는 5~15분 이상 늦어질 수 있음
  workflow_dispatch:

# 실행이 겹치면 state.json 이 꼬이므로 한 번에 하나씩만
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 이전 상태 복원
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: 설정 파일 준비
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          if [ -n "$CONFIG_YAML" ]; then printf '%s\n' "$CONFIG_YAML" > config.yaml; fi
          test -f config.yaml || { echo "::error::CONFIG_YAML Secret 이 없습니다 (README 참고)"; exit 1; }

      - name: 점검
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 공개 저장소는 실행 로그를 누구나 볼 수 있으므로 경고·오류만 남긴다
          LOG_LEVEL: WARNING
        run: python main.py --once --log-dir ""

      - name: 상태 저장
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
